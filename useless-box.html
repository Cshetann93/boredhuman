<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Useless Box 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0e1013;
    --accent-orange: #ff5500;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 50% 25%, #252a34 0%, #0a0b0e 75%);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #f8fafc;
    overflow: hidden;
  }

  /* Top Telemetry HUD */
  .hud {
    display: flex;
    gap: 16px;
    margin-bottom: 30px;
    z-index: 20;
  }

  .hud-pill {
    background: #16181d;
    border: 2px solid #2e333d;
    padding: 10px 20px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 6px 0 #08090b;
  }

  .hud-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #64748b;
    font-weight: 700;
  }

  .hud-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: #f8fafc;
  }

  /* 3D Viewport & Camera */
  .viewport {
    width: 640px;
    height: 420px;
    perspective: 1100px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .camera-rig {
    width: 380px;
    height: 220px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(52deg) rotateZ(-18deg);
    transition: transform 0.12s ease-out;
  }

  .box-3d {
    width: 380px;
    height: 220px;
    position: relative;
    transform-style: preserve-3d;
  }

  /* Whole-box physical shake states */
  .box-3d.shake-mild {
    animation: shake3DMild 0.1s infinite;
  }

  .box-3d.shake-violent {
    animation: shake3DViolent 0.08s infinite;
  }

  .box-3d.hop {
    transform: translateZ(22px) rotateY(-3deg);
    transition: transform 0.06s ease-out;
  }

  @keyframes shake3DMild {
    0%, 100% { transform: translate3d(0, 0, 0); }
    25% { transform: translate3d(-3px, 2px, 1px); }
    75% { transform: translate3d(3px, -2px, 0); }
  }

  @keyframes shake3DViolent {
    0%, 100% { transform: translate3d(0, 0, 0) rotateZ(0deg); }
    20% { transform: translate3d(-6px, -3px, 4px) rotateZ(-1.5deg); }
    40% { transform: translate3d(6px, 3px, 0px) rotateZ(1.5deg); }
    60% { transform: translate3d(-5px, 2px, 3px) rotateZ(-1deg); }
    80% { transform: translate3d(5px, -3px, 1px) rotateZ(1deg); }
  }

  /* Ground Shadow on the Desk */
  .desk-shadow {
    position: absolute;
    inset: -12px;
    background: rgba(0, 0, 0, 0.78);
    filter: blur(22px);
    transform: translateZ(-126px);
    border-radius: 18px;
    pointer-events: none;
  }

  /* ==========================================
     EXTRUDED 3D CHASSIS WALLS (Depth = 124px)
     ========================================== */
  .wall {
    position: absolute;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }

  /* Front Wall (facing the viewer) */
  .wall-front {
    width: 380px;
    height: 124px;
    left: 0;
    top: 158px;
    transform: translateZ(-62px) rotateX(-90deg);
    background: 
      linear-gradient(180deg, #1d2026 0%, #121418 76%, #5c3a21 76%, #3f2614 100%);
    border: 2px solid #2e333d;
    border-top: 2px solid #383e4c;
    box-shadow: inset 0 12px 25px rgba(0,0,0,0.55);
  }

  /* Metallic manufacturer badge on the front wall */
  .front-badge {
    position: absolute;
    right: 26px;
    top: 32px;
    padding: 4px 10px;
    background: #0e1014;
    border: 1px solid #333946;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: #64748b;
    box-shadow: inset 0 1px 2px #000;
  }

  /* Right Wall (facing right) */
  .wall-right {
    width: 124px;
    height: 220px;
    left: 318px;
    top: 0;
    transform: translateZ(-62px) rotateY(90deg);
    background: 
      linear-gradient(90deg, #16181d 0%, #0e1014 76%, #4a2e19 76%, #2e1c0e 100%);
    border: 2px solid #252932;
  }

  /* Left Wall */
  .wall-left {
    width: 124px;
    height: 220px;
    left: -62px;
    top: 0;
    transform: translateZ(-62px) rotateY(-90deg);
    background: 
      linear-gradient(270deg, #22262e 0%, #15181d 76%, #6e4527 76%, #4a2e19 100%);
    border: 2px solid #2e333d;
  }

  /* Back Wall */
  .wall-back {
    width: 380px;
    height: 124px;
    left: 0;
    top: -62px;
    transform: translateZ(-62px) rotateX(90deg);
    background: #101216;
    border: 2px solid #1f232b;
  }

  /* ==========================================
     RECESSED DARK CAVITY (Left Half)
     ========================================== */
  .cavity-well {
    position: absolute;
    left: 12px;
    top: 12px;
    width: 196px;
    height: 196px;
    background: #040507;
    transform: translateZ(-32px);
    border-radius: 6px;
    box-shadow: inset 0 0 35px #000000;
  }

  /* Inner rim walls so looking inside shows depth */
  .cavity-rim-front {
    position: absolute;
    left: 12px;
    top: 192px;
    width: 196px;
    height: 32px;
    background: linear-gradient(180deg, #15181e, #050608);
    transform: translateZ(-16px) rotateX(90deg);
  }

  .cavity-rim-back {
    position: absolute;
    left: 12px;
    top: -4px;
    width: 196px;
    height: 32px;
    background: linear-gradient(180deg, #050608, #111318);
    transform: translateZ(-16px) rotateX(-90deg);
  }

  .cavity-rim-divider {
    position: absolute;
    left: 192px;
    top: 12px;
    width: 32px;
    height: 196px;
    background: #0c0e12;
    transform: translateZ(-16px) rotateY(-90deg);
  }

  /* Glowing Red Eyes deep inside the cavity */
  .cavity-eyes {
    position: absolute;
    top: 52px;
    right: 26px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .cavity-eyes.glow {
    opacity: 1;
  }

  .eye {
    width: 6px;
    height: 10px;
    background: #ff2a2a;
    border-radius: 3px;
    box-shadow: 0 0 12px #ff2a2a, 0 0 24px #ff0000;
  }

  /* ==========================================
     RIGHT DECK SURFACE & 3D TOGGLE SWITCH
     ========================================== */
  .right-deck {
    position: absolute;
    right: 0;
    top: 0;
    width: 172px;
    height: 220px;
    background: linear-gradient(135deg, #262a33 0%, #181b21 100%);
    border: 2px solid #363c48;
    border-left: 2px solid #0e1014;
    transform-style: preserve-3d;
    box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.08);
  }

  /* Corner Hex Bolts */
  .screw {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #111317;
    border: 2px solid #3b4250;
    transform: translateZ(1px);
  }
  .screw::before {
    content: "";
    position: absolute;
    top: 3px;
    left: 1px;
    width: 6px;
    height: 2px;
    background: #3b4250;
    transform: rotate(35deg);
  }
  .screw.tr { top: 14px; right: 14px; }
  .screw.br { bottom: 14px; right: 14px; }
  .screw.tl { top: 14px; left: 14px; }
  .screw.bl { bottom: 14px; left: 14px; }

  /* Status LED */
  .led-housing {
    position: absolute;
    top: 26px;
    left: 50%;
    transform: translateX(-50%) translateZ(2px);
    display: flex;
    align-items: center;
    gap: 8px;
    background: #0f1115;
    padding: 5px 12px;
    border-radius: 99px;
    border: 1px solid #2d333f;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
  }

  .led-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #334155;
    transition: background 0.1s ease, box-shadow 0.1s ease;
  }

  .led-dot.active {
    background: var(--accent-orange);
    box-shadow: 0 0 14px var(--accent-orange), 0 0 5px #ffffff;
  }

  .led-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #94a3b8;
  }

  /* Interactive 3D Switch Assembly */
  .switch-assembly {
    position: absolute;
    top: 72px;
    left: 48px;
    width: 76px;
    height: 76px;
    transform-style: preserve-3d;
    cursor: pointer;
  }

  .washer-plate {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background: linear-gradient(145deg, #323844, #171a20);
    border: 2px solid #475569;
    transform: translateZ(3px);
    box-shadow: 0 10px 18px rgba(0,0,0,0.65);
  }

  .hex-nut {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle, #0b0d11 32%, #64748b 36%, #334155 72%);
    border: 2px solid #cbd5e1;
    transform: translateZ(7px);
    box-shadow: 0 6px 10px rgba(0,0,0,0.6);
  }

  /* Upright 3D Bat Handle Stalk */
  .lever-pivot {
    position: absolute;
    left: 38px;
    top: 38px;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    transform: translateZ(8px) rotateY(28deg);
    transition: transform 0.09s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .switch-assembly.is-on .lever-pivot {
    transform: translateZ(8px) rotateY(-28deg);
  }

  /* Crossed planes so the stalk has volume from every angle */
  .stalk-beam {
    position: absolute;
    left: -5px;
    top: 0;
    width: 10px;
    height: 36px;
    background: linear-gradient(90deg, #94a3b8, #f8fafc, #475569);
    border-radius: 5px;
    transform-origin: center top;
    transform: rotateX(90deg);
  }

  .stalk-beam.cross {
    transform: rotateX(90deg) rotateY(90deg);
  }

  /* 3D Chrome Tip Cap at top of stalk */
  .stalk-tip {
    position: absolute;
    left: -11px;
    top: -11px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #cbd5e1 45%, #475569 100%);
    transform: translateZ(36px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    transition: background 0.1s ease;
  }

  .switch-assembly.is-on .stalk-tip {
    background: radial-gradient(circle at 35% 35%, #fff7ed 0%, #fdba74 45%, #ea580c 100%);
    box-shadow: 0 0 12px rgba(255, 85, 0, 0.5);
  }

  .switch-labels {
    position: absolute;
    bottom: 24px;
    left: 41px;
    width: 90px;
    display: flex;
    justify-content: space-between;
    transform: translateZ(2px);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: #64748b;
  }

  .switch-labels span.lit {
    color: #f8fafc;
  }

  /* ==========================================
     THICK 3D HINGED LID DOOR (Left Half)
     ========================================== */
  .lid-3d {
    position: absolute;
    left: 0;
    top: 0;
    width: 208px;
    height: 220px;
    transform-origin: left center;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
    pointer-events: none;
  }

  /* Outer Top Surface of Lid */
  .lid-top {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #2a2f39 0%, #191c22 100%);
    border: 2px solid #383f4d;
    border-right: 2px solid #0f1115;
    transform: translateZ(10px);
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.08);
    backface-visibility: hidden;
  }

  /* Underside of Lid (visible when lid opens wide) */
  .lid-under {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #4a2e19 0%, #2b1a0e 100%);
    border: 3px solid #16181d;
    transform: rotateY(180deg);
    backface-visibility: hidden;
  }

  /* Extruded Right Lip of the Lid (shows physical board thickness) */
  .lid-edge-right {
    position: absolute;
    left: 198px;
    top: 0;
    width: 10px;
    height: 220px;
    background: #5c3a21;
    border-top: 1px solid #7c4d2b;
    border-bottom: 1px solid #3a2312;
    transform: translateZ(5px) rotateY(90deg);
  }

  /* Extruded Front Lip of the Lid */
  .lid-edge-front {
    position: absolute;
    left: 0;
    top: 210px;
    width: 208px;
    height: 10px;
    background: #22262e;
    border-bottom: 2px solid #111317;
    transform: translateZ(5px) rotateX(-90deg);
  }

  /* ==========================================
     CURVED 3D MECHANICAL ARM (Pivots inside cavity)
     ========================================== */
  .arm-pivot {
    position: absolute;
    left: 192px;
    top: 110px;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    transform: translateZ(-12px);
    pointer-events: none;
  }

  /* Vertical plane of the curved C-arm */
  .arm-vertical-svg {
    position: absolute;
    left: -170px;
    top: -115px;
    width: 290px;
    height: 160px;
    transform-origin: 170px 115px;
    transform: rotateX(-90deg);
    overflow: visible;
  }

  /* Horizontal thickness crossbar so the arm looks solid from top-down */
  .arm-spine-top {
    position: absolute;
    left: -140px;
    top: -11px;
    width: 230px;
    height: 22px;
    border-radius: 11px;
    background: linear-gradient(90deg, #475569, #cbd5e1 65%, #ff5500 88%);
    border: 2px solid #1e293b;
    transform: translateZ(58px) rotateY(14deg);
    box-shadow: 0 8px 16px rgba(0,0,0,0.6);
  }

  .footer-hint {
    margin-top: 24px;
    font-size: 12px;
    color: #64748b;
    letter-spacing: 1px;
    font-family: 'JetBrains Mono', monospace;
    z-index: 20;
  }

  @media (max-width: 650px) {
    .viewport {
      transform: scale(0.78);
    }
  }
</style>
</head>
<body>

  <div class="hud">
    <div class="hud-pill">
      <span class="hud-label">Flips</span>
      <span id="flip-count" class="hud-value">0</span>
    </div>
    <div class="hud-pill">
      <span class="hud-label">Mood</span>
      <span id="mood-name" class="hud-value">IDLE</span>
    </div>
  </div>

  <div id="viewport" class="viewport">
    <div id="camera-rig" class="camera-rig">
      <div id="box-3d" class="box-3d">

        <!-- Soft ground shadow on the desk -->
        <div class="desk-shadow"></div>

        <!-- Extruded 3D Side Walls -->
        <div class="wall wall-back"></div>
        <div class="wall wall-left"></div>
        <div class="wall wall-right"></div>
        <div class="wall wall-front">
          <div class="front-badge">MK-IV // USELESS</div>
        </div>

        <!-- Recessed Dark Interior Cavity -->
        <div class="cavity-well">
          <div id="cavity-eyes" class="cavity-eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
        </div>
        <div class="cavity-rim-front"></div>
        <div class="cavity-rim-back"></div>
        <div class="cavity-rim-divider"></div>

        <!-- 3D Mechanical Arm (rotates up out of the cavity in 3D space) -->
        <div id="arm-pivot" class="arm-pivot">
          <div id="arm-rotor" style="transform-style: preserve-3d;">
            <svg class="arm-vertical-svg" viewBox="0 0 290 160">
              <defs>
                <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#475569"/>
                  <stop offset="50%" stop-color="#e2e8f0"/>
                  <stop offset="100%" stop-color="#94a3b8"/>
                </linearGradient>
                <linearGradient id="tipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ff6a00"/>
                  <stop offset="100%" stop-color="#b83300"/>
                </linearGradient>
              </defs>
              <!-- Curved C-hook mechanical finger profile -->
              <path d="M 35 125 C 35 30, 185 20, 250 78" fill="none" stroke="#1e293b" stroke-width="34" stroke-linecap="round"/>
              <path d="M 35 125 C 35 30, 185 20, 250 78" fill="none" stroke="url(#metalGrad)" stroke-width="28" stroke-linecap="round"/>
              <!-- Cutout holes along the curved beam -->
              <circle cx="85" cy="70" r="6" fill="#0f172a"/>
              <circle cx="130" cy="54" r="6" fill="#0f172a"/>
              <circle cx="178" cy="52" r="6" fill="#0f172a"/>
              <!-- Orange rubberized bumper tip -->
              <circle cx="254" cy="82" r="16" fill="url(#tipGrad)" stroke="#1e293b" stroke-width="2"/>
            </svg>
            <div class="arm-spine-top"></div>
          </div>
        </div>

        <!-- Thick 3D Hinged Lid Door -->
        <div id="lid-3d" class="lid-3d">
          <div class="lid-top">
            <div class="screw tl"></div>
            <div class="screw bl"></div>
          </div>
          <div class="lid-under"></div>
          <div class="lid-edge-right"></div>
          <div class="lid-edge-front"></div>
        </div>

        <!-- Right Top Deck & Upright 3D Toggle Switch -->
        <div class="right-deck">
          <div class="screw tr"></div>
          <div class="screw br"></div>

          <div class="led-housing">
            <div id="led-dot" class="led-dot"></div>
            <span id="led-text" class="led-text">OFF</span>
          </div>

          <div id="switch-assembly" class="switch-assembly" role="button" aria-label="3D Toggle Switch">
            <div class="washer-plate"></div>
            <div class="hex-nut"></div>
            <div class="lever-pivot">
              <div class="stalk-beam"></div>
              <div class="stalk-beam cross"></div>
              <div class="stalk-tip"></div>
            </div>
          </div>

          <div class="switch-labels">
            <span id="lbl-on">ON</span>
            <span id="lbl-off" class="lit">OFF</span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="footer-hint">MOVE MOUSE TO ORBIT CAMERA // CLICK SWITCH TO FLIP</div>

<script>
  const cameraRig = document.getElementById('camera-rig');
  const box3d = document.getElementById('box-3d');
  const switchAssembly = document.getElementById('switch-assembly');
  const ledDot = document.getElementById('led-dot');
  const ledText = document.getElementById('led-text');
  const lblOn = document.getElementById('lbl-on');
  const lblOff = document.getElementById('lbl-off');
  const lid3d = document.getElementById('lid-3d');
  const armRotor = document.getElementById('arm-rotor');
  const eyesEl = document.getElementById('cavity-eyes');
  const flipCountEl = document.getElementById('flip-count');
  const moodNameEl = document.getElementById('mood-name');

  let isSwitchOn = false;
  let isBusy = false;
  let flipCount = 0;
  let lastPersonalityIndex = -1;

  // Interactive 3D Parallax Camera Orbit
  window.addEventListener('pointermove', (e) => {
    const nx = (e.clientX / window.innerWidth - 0.5) * 2;
    const ny = (e.clientY / window.innerHeight - 0.5) * 2;
    const rotX = 52 - ny * 10;
    const rotZ = -18 + nx * 14;
    cameraRig.style.transform = `rotateX(${rotX.toFixed(2)}deg) rotateZ(${rotZ.toFixed(2)}deg)`;
  });

  // Current animated positions (0 to 1)
  let currentLid = 0;
  let currentArm = 0;

  // Web Audio Synthesizer
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function soundSwitchClick(turningOn) {
    const ctx = getAudio();
    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(turningOn ? 1950 : 1420, now);
    osc.frequency.exponentialRampToValueAtTime(210, now + 0.028);

    gain.gain.setValueAtTime(0.75, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.028);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.03);
  }

  function soundServo(durationMs, pitchBase = 240) {
    if (durationMs < 35) return;
    const ctx = getAudio();
    const now = ctx.currentTime;
    const dur = durationMs / 1000;

    const osc = ctx.createOscillator();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(pitchBase, now);
    osc.frequency.linearRampToValueAtTime(pitchBase * 1.18, now + dur * 0.5);
    osc.frequency.linearRampToValueAtTime(pitchBase * 0.92, now + dur);

    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(820, now);
    filter.Q.setValueAtTime(3.0, now);

    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.14, now + 0.02);
    gain.gain.setValueAtTime(0.14, Math.max(now + 0.02, now + dur - 0.02));
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur);
  }

  function soundLidSlam(intensity = 1) {
    const ctx = getAudio();
    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(130 * intensity, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.095);

    gain.gain.setValueAtTime(Math.min(1, 0.85 * intensity), now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.105);
  }

  function soundGrowl(durationMs) {
    const ctx = getAudio();
    const now = ctx.currentTime;
    const dur = durationMs / 1000;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(65, now);

    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur);
  }

  // 3D Transform Renderers

    currentLid = val;
    // Opens upward into 3D space along the left hinge
    const angle = -val * 78;

  }

  function renderArm(val) {
    currentArm = val;
    // Rotates from hidden inside the cavity (-75 deg) to arching over the deck (+16 deg)
    const rotY = -75 + (val * 91);

    armRotor.style.transform = `translateZ(${transZ}px) rotateY(${rotY}deg)`;
  }

  const wait = (ms) => new Promise(res => setTimeout(res, ms));

  function tween(from, to, duration, onUpdate) {
    return new Promise(resolve => {
      if (duration <= 0) {
        onUpdate(to);
        resolve();
        return;
      }
      const start = performance.now();
      function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        onUpdate(from + (to - from) * eased);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  async function moveLid(target, ms, slamSound = false) {
    const dist = Math.abs(target - currentLid);
    if (dist > 0.05) {
      soundServo(ms, target > currentLid ? 260 : 210);
    }
    await tween(currentLid, target, ms, renderLid);
    if (target === 0 && slamSound) {
      soundLidSlam(ms < 120 ? 1.3 : 0.8);
    }
  }

  async function moveArm(target, ms) {
    const dist = Math.abs(target - currentArm);
    if (dist > 0.05) {
      soundServo(ms, target > currentArm ? 330 : 280);
    }
    await tween(currentArm, target, ms, renderArm);
  }

  function pickPersonality() {
    if (flipCount === 0) return personalities[0];
    if (flipCount === 1) return personalities[1];

    let idx;
    do {
      idx = Math.floor(Math.random() * personalities.length);
    } while (idx === lastPersonalityIndex);

    lastPersonalityIndex = idx;
    return personalities[idx];
  }
